name: Build SnipeFeed QMOD

on:
  push:
    branches:
      - chatgpt-qmod-build
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QPM CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir -p /tmp/qpm
          gh release download v1.5.11 --repo QuestPackageManager/QPM.CLI --pattern 'qpm-linux-x64.zip' --dir /tmp/qpm
          unzip -o /tmp/qpm/qpm-linux-x64.zip -d /tmp/qpm
          chmod +x /tmp/qpm/qpm
          echo "/tmp/qpm" >> "$GITHUB_PATH"

      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build without qpackages
        shell: bash
        run: bash scripts/build-without-qpackages.sh

      - name: Verify output
        shell: bash
        run: |
          ls -lah SnipeFeed.qmod build/libsnipefeed.so
          unzip -l SnipeFeed.qmod

      - name: Upload qmod
        uses: actions/upload-artifact@v4
        with:
          name: SnipeFeed-qmod
          path: SnipeFeed.qmod
          if-no-files-found: error
